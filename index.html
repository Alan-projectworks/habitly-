<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Habitly</title>
</head>
<body>
    <h1>Habitly.</h1>
    <p></p>

    <div class="box1">
        <h2>Where there is will there is a way</h2>
        <p>Alan V Mathews</p>
    </div>

    <div class="boxes">
        <div class="box2">
            <h2>0/10</h2>
            <p>Done</p>
        </div>

        <div class="box3">
            <h2>0 Days</h2>
            <p>streak</p>
        </div>

        <div class="weekrate">
            <h2>60%</h2>
        </div>
    </div>

    <div class="habit>">
        <input type="text" placeholder="e.g.stretch for 30 mins">
        <button>Add Habit</button>
        <p>💧</p>
        <p>🏃</p>
        <p>🏋️</p>
        <p>📗</p>
        <p>😴</p>
        <p>🍽️</p>
        <p>✍️</p>
       <p>🧘‍♂️</p>
       <p>💻</p>
    </div>

    <div class="progress">
        <h2>This week</h2>

    </div>

    <div class="addhab">
        <h2>Your Habits</h2>
        <h3>All</h3>
        <h3>Done Today</h3>
        <h3>Pending</h3>



        <div>

        </div>
    </div></body>
</html>
